name: Tag version

# On every push to main: read "Version:" from the plugin header and create the
# annotated tag v<version> if it does not exist yet. Safe to re-run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag from plugin version
        run: |
          set -e
          V=$(grep -m1 -oP '^\s*\*\s*Version:\s*\K[0-9][0-9A-Za-z.\-]*' no-comments-on-media.php)
          [ -n "$V" ] || { echo "::error::No Version: in no-comments-on-media.php"; exit 1; }
          T="v$V"
          if git rev-parse -q --verify "refs/tags/$T" >/dev/null; then
            echo "$T already exists, nothing to do"; exit 0
          fi
          git config user.name "Zdravko Lukic"
          git config user.email "zdravko.lukic@outlook.com"
          git tag -a "$T" -m "No Comments on Media $V"
          git push origin "refs/tags/$T"
          echo "Created $T"
